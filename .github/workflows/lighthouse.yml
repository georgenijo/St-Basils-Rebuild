name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: read
      statuses: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Vercel Preview
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The action waits half of this for Vercel to create the deployment
          # and the full value for it to finish. 300 failed runs whenever the
          # Vercel build queued for more than 150s.
          max_timeout: 900
          check_interval: 10

      - name: List pages to audit
        id: urls
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.url }}
        run: |
          {
            echo 'urls<<EOF'
            node scripts/lighthouse/budget.mjs urls "$PREVIEW_URL"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          # Never put the protection-bypass secret in the tested URL: Lighthouse
          # records that URL in the uploaded public report and in the PR
          # comment. Previews are not protected, so no bypass is needed, and
          # budget.mjs keeps only the preview's origin.
          urls: ${{ steps.urls.outputs.urls }}
          # Thresholds (median of 3 mobile runs per page) live in this file.
          configPath: scripts/lighthouse/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Check image budget
        id: images
        if: always() && steps.lighthouse.outputs.manifest != ''
        env:
          LIGHTHOUSE_MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
        run: node scripts/lighthouse/budget.mjs check-images

      - name: Post Results
        if: always() && steps.lighthouse.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          LIGHTHOUSE_MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
          LIGHTHOUSE_LINKS: ${{ steps.lighthouse.outputs.links }}
        with:
          script: |
            const manifest = JSON.parse(process.env.LIGHTHOUSE_MANIFEST || '[]');
            const links = JSON.parse(process.env.LIGHTHOUSE_LINKS || '{}');

            if (!manifest.length) {
              core.warning('No Lighthouse results to post');
              return;
            }

            const { checkImageBudget, renderComment } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/lighthouse/budget.mjs`
            );
            let imageBudget;
            try {
              imageBudget = checkImageBudget(manifest);
            } catch (error) {
              core.warning(`Image budget could not be read: ${error.message}`);
            }
            // Tested URLs and image labels are printed without query strings,
            // so nothing from a URL's query can reach this public comment.
            const body = renderComment({ manifest, links, imageBudget });

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body?.includes('## Lighthouse Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
